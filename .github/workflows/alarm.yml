name: 알림 발송

# 동작: 실행 하나가 50분 동안 매 1분 확인하고, 끝날 때 스스로 다음 실행을 예약해서 이어 달림.
# 5분 예약(cron)은 GitHub 가 늦게/안 깨워 줘도 되도록, 혹시 이어 달리기가 끊겼을 때 다시 살리는 보험.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:           # Actions 탭에서 "Run workflow" 로 수동 실행
    inputs:
      dry_run:
        description: "1 이면 실제로 보내지 않고 대상만 로그에 표시 (1회 확인 후 종료)"
        default: "0"

permissions:
  contents: read
  actions: write               # 자기 자신을 다시 실행 예약하기 위해 필요

concurrency:
  group: alarm
  cancel-in-progress: false    # 동시에 두 개 안 돌게. 새로 온 것은 대기했다가 이어서 시작

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 라이브러리 설치
        run: npm install --no-package-lock --no-audit --no-fund firebase-admin@12 web-push@3
        working-directory: server
      - name: 알림 발송
        run: node send-alarms.js
        working-directory: server
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
          LOOP_MIN: "50"
      - name: 다음 실행 예약 (이어 달리기)
        if: success() && github.event.inputs.dry_run != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run alarm.yml --ref main -f dry_run=0
